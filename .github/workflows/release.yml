name: Release Build

on:
  workflow_run:
    workflows: ['Test/Linter']
    types:
      - completed
    branches:
      - 'release'

permissions:
  contents: write

jobs:
  compute-version:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next_version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Determine bump type
        id: determine_bump
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          BUMP_TYPE="patch"
          if [[ "$COMMIT_MSG" == *"#major"* ]]; then
            BUMP_TYPE="major"
          fi
          if [[ "$COMMIT_MSG" == *"#minor"* ]]; then
            BUMP_TYPE="minor"
          fi
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
          echo "Bump type determined: $BUMP_TYPE"

      # Version is only computed here; it is committed by `commit-version`
      # after every platform built, so a failed build never burns a version.
      - name: Compute next version
        id: next_version
        env:
          BUMP_TYPE: ${{ steps.determine_bump.outputs.bump_type }}
        run: |
          node -e "
            const fs = require('fs');
            const [major, minor, patch] = require('./package.json').version.split('.').map(Number);
            const bumped = {
              major: [major + 1, 0, 0],
              minor: [major, minor + 1, 0],
              patch: [major, minor, patch + 1],
            }[process.env.BUMP_TYPE].join('.');
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + bumped + '\n');
            console.log('Next version:', bumped);
          "

  publish-tauri:
    needs: [compute-version]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: Apply release version
        shell: bash
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.env.VERSION;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Read Changelog
        id: changelog
        shell: node {0}
        run: |
          const fs = require('fs');
          let content = 'OWL release.';
          if (fs.existsSync('CHANGELOG.md')) {
            content = fs.readFileSync('CHANGELOG.md', 'utf8').trim();
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `body<<EOF\n${content}\nEOF\n`);

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'x86_64-apple-darwin aarch64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend assets
        run: pnpm exec vite build

      - name: Build and upload Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v${{ needs.compute-version.outputs.version }}
          releaseName: 'Release v${{ needs.compute-version.outputs.version }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload build artifacts to GitHub Actions
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owl-installers-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage

  commit-version:
    needs: [compute-version, publish-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Apply version bump
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            conf.version = process.env.VERSION;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2) + '\n');
          "

      - name: Commit and push changes
        env:
          VERSION: ${{ needs.compute-version.outputs.version }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json

          git commit -m "chore: bump version to $VERSION [skip ci]" || echo "No changes to commit"

          git push origin HEAD:release || echo "No changes to push to release"
          git push origin HEAD:main || echo "No changes to push to main"

  checksum-release:
    needs: [compute-version, publish-tauri, commit-version]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Point release at bumped commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.compute-version.outputs.version }}
        run: gh release edit "$TAG" --target "$(git rev-parse HEAD)" --repo "$GITHUB_REPOSITORY"

      - name: Generate Checksums and Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.compute-version.outputs.version }}
        run: |
          mkdir release-assets
          gh release download "$TAG" --dir release-assets --repo "$GITHUB_REPOSITORY"

          echo "| File Name | SHA-256 Checksum |" > checksums-table-only.md
          echo "| --- | --- |" >> checksums-table-only.md

          cd release-assets
          for file in *; do
            if [ -f "$file" ]; then
              sha256_hash=$(sha256sum "$file" | awk '{print $1}')
              echo "| \`$file\` | \`$sha256_hash\` |" >> ../checksums-table-only.md
            fi
          done
          cd ..

          echo "### Release Checksums" > checksums-table.md
          echo "Verified file integrity checksums for this release:" >> checksums-table.md
          echo "" >> checksums-table.md
          cat checksums-table-only.md >> checksums-table.md

          echo "" >> checksums-table.md
          echo "### Installation Assets" >> checksums-table.md

          gh release view "$TAG" --json body --jq .body > existing-body.txt
          cat existing-body.txt >> checksums-table.md

          gh release edit "$TAG" --notes-file checksums-table.md --draft=false --repo "$GITHUB_REPOSITORY"
