name: Test/Linter
on:
  push:
    branches: [main, master, release]
  pull_request:
    branches: [main, master, release]
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: lts/*
      - name: Install Rust
        uses: dtolnay/rust-toolchain@a54c7afa936fefeb4456b2dd8068152d414cf2b # stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install dependencies
        run: npm ci
      - name: Run Typecheck
        run: npm run typecheck
      - name: Run Linter
        run: npm run lint
      - name: Run i18n Check
        run: npm run check-i18n
      - name: Run Cargo Check
        run: npm run cargo:check
      - name: Build Web Assets
        run: npx vite build
      - name: Start Preview Server
        run: npm run preview &
      - name: Wait for Server
        run: npx wait-on http://localhost:4173 --timeout 60000
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Unit Tests
        run: npm run unit
      - name: Run Playwright Automation Tests
        run: npm run automation
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2 # v4.5.0
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
