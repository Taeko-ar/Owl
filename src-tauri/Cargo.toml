[package]
name = "owl"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2.11.0", features = ["wry"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["rustls-tls", "json"] }
zip = "0.6"
sevenz-rust = "0.6.1"
tempfile = "3.6"
rfd = "0.14"
dirs = "5.0"
tauri-plugin-updater = "2.10.1"
sha1 = "0.10"
base64 = "0.22.1"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }
